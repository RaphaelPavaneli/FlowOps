name: Publicação das imagens Docker

on:
  workflow_run:
    workflows:
      - Integração contínua
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publicar-imagens:
    name: Publicar ${{ matrix.image }}
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flowops-backend
            context: ./backend

          - image: flowops-frontend
            context: ./frontend

    steps:
      - name: Baixar o código aprovado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e metadados
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/raphaelpavaneli/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
        