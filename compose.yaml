name: flowops

services:
  backend:
    build:
      context: ./backend

    image: flowops-backend:local

    env_file:
      - ./backend/.env

    environment:
      DB_SERVER: host.docker.internal

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend

    image: flowops-frontend:local

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"